[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vyra-scalper"
version = "0.1.0"
description = "VYRA Scalper Engine — multi-market systematic trading platform"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The engine core deliberately has no third-party runtime dependency beyond PyYAML.
# Everything below is for research, storage and services at the edges.
data = ["pandas>=2.0", "pyarrow>=14.0", "numpy>=1.26"]
# scikit-learn only for now: the first model is a logistic regression, deliberately,
# and adding gradient boosting is a decision to take after a linear model has been shown
# to be the limitation.
ml = ["scikit-learn>=1.4", "numpy>=1.26"]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "python-jose[cryptography]>=3.3",
    # FastAPI parses the OAuth2 password form with it; /auth/token raises at import
    # time without it, so it is a hard dependency of the service, not an extra.
    "python-multipart>=0.0.9",
]
storage = ["psycopg[binary]>=3.1", "redis>=5.0"]
# Live venue connectivity. Separate from the engine core, which still depends only on the
# standard library plus PyYAML: a backtest must not need a websocket library to run.
live = ["websockets>=12.0", "httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "mypy>=1.9", "ruff>=0.3"]

[tool.setuptools]
packages = ["core", "brokers", "data", "apps"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (walk-forward, Monte Carlo)",
    "chaos: fault-injection tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    # Exception names: NotReady, SymbolNotMapped and InvalidOrderTransition read as the
    # conditions they describe and are named that way in the specification documents.
    # Renaming them to *Error would make the code and the specs disagree.
    "N818",
    # Docstrings quote real market notation (en dashes, arrows) that ruff flags as
    # ambiguous unicode. It is prose, not identifiers.
    "RUF002",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["core", "brokers", "data", "apps"]

[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*", "yaml.*", "jose.*", "sklearn.*", "redis.*", "psycopg.*"]
ignore_missing_imports = true
