# Development stack.
#
# Secrets are never written here: every credential is an environment reference resolved at
# load time, and the engine refuses to start on an unset reference with no default.

name: vyra

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: ${POSTGRES_DB:-vyra}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vyra}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  engine:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: engine
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      VYRA_ENV: ${VYRA_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vyra}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../../runs:/app/runs
    # The engine never starts in LIVE mode from compose.  Live deployment is a deliberate,
    # separately-approved step after paper and shadow are operational (ROADMAP.md).
    command: ["python", "scripts/run_backtest.py", "--quiet"]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    ports: ["8000:8000"]
    environment:
      # No defaults. The API refuses to start without a signing secret of its own and at
      # least one configured account, which is the point: a service that comes up with a
      # known key is one whose tokens anyone can forge.
      VYRA_API_SECRET: ${VYRA_API_SECRET:?set VYRA_API_SECRET (32+ characters) in your environment}
      VYRA_API_USERS: ${VYRA_API_USERS:?set VYRA_API_USERS as name:password:ROLE,...}
      VYRA_CORS_ORIGINS: ${VYRA_CORS_ORIGINS:-http://localhost:3000}
      VYRA_RUNS_DIR: /app/runs
      VYRA_STATE_DIR: /app/state
    volumes:
      # Read-only: the API reads completed runs and must not be able to alter the record of
      # what a run produced. Its own durable state — the kill switch — goes to a separate
      # writable volume, so a tripped switch still survives a restart.
      - ../../runs:/app/runs:ro
      - apistate:/app/state

volumes:
  pgdata:
  redisdata:
  apistate:
