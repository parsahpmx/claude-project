# The reference MVP backtest.  Everything a run needs is here, so the run is reproducible
# from this file plus the referenced dataset (BACKTEST_SPEC.md 7).

run:
  name: mvp_vwap_mes
  mode: BACKTEST
  random_seed: 20240315

data:
  # SYNTHETIC exercises the pipeline without vendor data and is watermarked in every
  # report. CSV reads vendor files directly. PARQUET reads the normalised layer produced
  # by scripts/ingest_data.py, which is the path to use once licensed data is available:
  # it carries a manifest whose content hash the run manifest references, so a result
  # cannot be silently re-attributed to changed data.
  source: SYNTHETIC          # SYNTHETIC | CSV | PARQUET
  instruments: ["CME:MES"]
  start: "2024-03-04T00:00:00Z"
  end: "2024-03-09T00:00:00Z"
  synthetic:
    # A seeded generator, used so the pipeline is testable without vendor data.  Results
    # from synthetic data are watermarked SYNTHETIC and support no expectancy claim.
    #
    # There is deliberately no seed here: the generator's seed is derived from
    # run.random_seed above, so a single number determines the whole run and the manifest
    # cannot record a seed that does not in fact reproduce it.
    start_price: 5100.0
    annual_volatility: 0.18
    trade_arrival_per_second: 1.5
    spread_ticks_mean: 1.0
    spread_ticks_wide_prob: 0.05
    mean_reversion_strength: 0.02
    tick_interval_ms: 250

  # Used when source is PARQUET.
  parquet:
    root: data_store/mes           # directory containing _manifest.json
    # Re-hash the files and compare against the manifest before reading. Off by default
    # because hashing a large archive on every run is expensive; turn it on for a
    # promotion run, where the cost is worth the certainty.
    verify_content: false

  # Used when source is CSV. Column names are declared, never guessed: reading the ask
  # column as the bid produces a plausible backtest with inverted spreads.
  csv:
    files: []                      # paths or globs
    timestamp_column: timestamp
    timestamp_format: iso          # iso | epoch_ns | epoch_us | epoch_ms | epoch_s
    bid_column: bid
    ask_column: ask
    bid_size_column: bid_size
    ask_size_column: ask_size
    price_column: price
    size_column: size
    aggressor_column: aggressor

strategies: [vwap_mean_reversion]

execution:
  fill_model: REALISTIC      # OPTIMISTIC is blocked from promotion decisions
  queue_ratio: 1.0           # displayed volume required, as a multiple of order size
  reject_rate: 0.01
  partial_fill_probability: 0.15

output:
  directory: runs
  write_trades: true
  write_equity: true
  write_orders: true
  write_fills: true
  write_risk_events: true
  write_report: true
