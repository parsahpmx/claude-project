name: VYRA CI

on:
  push:
    branches: ["**"]
    paths: ["vyra-scalper/**", ".github/workflows/vyra-ci.yml"]
  pull_request:
    paths: ["vyra-scalper/**", ".github/workflows/vyra-ci.yml"]

# A newer push to the same branch makes the running job's result irrelevant.
concurrency:
  group: vyra-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vyra-scalper

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The api extra is installed here even though the engine does not need it: without
      # it the API tests skip themselves, and a suite that silently stops running is worse
      # than one that fails.
      - name: Install
        run: pip install -e ".[dev,data,api]"
      - name: Lint
        run: ruff check core brokers data apps tests scripts
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -q --cov=core --cov=brokers --cov=data --cov=apps --cov-report=term-missing
      - name: The API suite actually ran
        run: |
          # importorskip turns a missing dependency into a pass, so a broken install would
          # show as a green suite that tested nothing. Assert the dependency is importable
          # and that the run reports passes and no skips.
          python -c "import fastapi, jose, multipart"
          # No extra -q: pyproject already sets it, and -qq suppresses the summary line
          # this check reads.
          pytest tests/api | tee api-suite.txt
          grep -qE '[0-9]+ passed' api-suite.txt
          ! grep -qE '[0-9]+ skipped' api-suite.txt

  acceptance:
    name: MVP acceptance criteria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,data]"
      - name: Acceptance suite
        run: pytest tests/backtest -q
      - name: Reference backtest runs end to end
        run: python scripts/run_backtest.py --output /tmp/runs --quiet

  storage:
    name: storage (postgres + redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyra-scalper
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vyra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VYRA_TEST_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/vyra_test
      VYRA_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # One test starts and kills its own Redis, so the binary has to be on the runner as
      # well as in a service container. Killing the shared service would take the rest of
      # the suite with it.
      - name: Install redis-server for the disposable-instance test
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Install
        run: pip install -e ".[dev,data,api,storage]"
      - name: Storage suite
        run: |
          # These tests skip themselves without the services, so a broken service block
          # would show as a green job that tested nothing. Assert passes and no skips.
          pytest tests/storage | tee storage-suite.txt
          grep -qE '[0-9]+ passed' storage-suite.txt
          ! grep -qE '[0-9]+ skipped' storage-suite.txt

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyra-scalper/apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vyra-scalper/apps/dashboard/package-lock.json
      - name: Install
        run: npm ci
      # typegen first: next-env.d.ts references route types that only Next generates, so a
      # bare tsc on a clean checkout fails on a file the framework owns.
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for credential-shaped strings in configuration
        working-directory: vyra-scalper
        run: |
          # Config must reference secrets through ${VAR}, never inline them.
          if grep -rEn '(password|api_key|api_token|secret)\s*:\s*["'"'"']?[A-Za-z0-9/+_-]{12,}' configs/; then
            echo "::error::a credential-shaped literal is present in configs/"
            exit 1
          fi
          echo "no inline credentials found"
