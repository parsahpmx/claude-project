name: VYRA CI

on:
  push:
    branches: ["**"]
    paths: ["vyra-scalper/**", ".github/workflows/vyra-ci.yml"]
  pull_request:
    paths: ["vyra-scalper/**", ".github/workflows/vyra-ci.yml"]

# A newer push to the same branch makes the running job's result irrelevant.
concurrency:
  group: vyra-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vyra-scalper

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The api extra is installed here even though the engine does not need it: without
      # it the API tests skip themselves, and a suite that silently stops running is worse
      # than one that fails.
      - name: Install
        run: pip install -e ".[dev,data,api]"
      - name: Lint
        run: ruff check core brokers data apps tests scripts
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -q --cov=core --cov=brokers --cov=data --cov=apps --cov-report=term-missing
      - name: The API suite actually ran
        run: |
          # importorskip turns a missing dependency into a pass, so a broken install would
          # show as a green suite that tested nothing. Assert the dependency is importable
          # and that the run reports passes and no skips.
          python -c "import fastapi, jose, multipart"
          # No extra -q: pyproject already sets it, and -qq suppresses the summary line
          # this check reads.
          pytest tests/api | tee api-suite.txt
          grep -qE '[0-9]+ passed' api-suite.txt
          ! grep -qE '[0-9]+ skipped' api-suite.txt

  acceptance:
    name: MVP acceptance criteria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,data]"
      - name: Acceptance suite
        run: pytest tests/backtest -q
      - name: Reference backtest runs end to end
        run: python scripts/run_backtest.py --output /tmp/runs --quiet

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyra-scalper/apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vyra-scalper/apps/dashboard/package-lock.json
      - name: Install
        run: npm ci
      # typegen first: next-env.d.ts references route types that only Next generates, so a
      # bare tsc on a clean checkout fails on a file the framework owns.
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for credential-shaped strings in configuration
        working-directory: vyra-scalper
        run: |
          # Config must reference secrets through ${VAR}, never inline them.
          if grep -rEn '(password|api_key|api_token|secret)\s*:\s*["'"'"']?[A-Za-z0-9/+_-]{12,}' configs/; then
            echo "::error::a credential-shaped literal is present in configs/"
            exit 1
          fi
          echo "no inline credentials found"
